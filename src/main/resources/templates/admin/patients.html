<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Manage Patients')"></head>
<body>

    <div th:replace="layout :: admin_sidebar('patients')"></div>

    <div class="main-content animate-fade-in">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Patient Management</h2>
        </div>

        <div class="glass-card p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>MRN</th>
                            <th>Name</th>
                            <th>Gender</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="patient : ${patients}">
                            <td class="fw-bold text-primary" th:text="${patient.medicalRecordNumber}">MRN-001</td>
                            <td th:text="${patient.name}">John Doe</td>
                            <td th:text="${patient.gender}">Male</td>
                            <td th:text="${patient.phone}">0812345678</td>
                            <td><span class="badge bg-success">Active</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-info">View</button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(patients)}">
                            <td colspan="6" class="text-center text-muted py-4">No patients registered yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div th:replace="layout :: scripts"></div>
</body>
</html>
