<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Manage Rooms')"></head>
<body>

    <div th:replace="layout :: admin_sidebar('rooms')"></div>

    <!-- Main Content -->
    <div class="main-content animate-fade-in">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Room Management</h2>
            <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addRoomModal">
                <i class="fa-solid fa-plus me-2"></i> Add New Room
            </button>
        </div>

        <div class="glass-card p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Room Number</th>
                            <th>Type</th>
                            <th>Floor</th>
                            <th>Price / Night</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="room : ${rooms}">
                            <td class="fw-bold text-primary" th:text="${room.roomNumber}">101</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${room.type}">VIP</span>
                            </td>
                            <td th:text="${room.floor}">1</td>
                            <td th:text="${'Rp ' + #numbers.formatDecimal(room.pricePerNight, 0, 'COMMA', 0, 'POINT')}">Rp 1,000,000</td>
                            <td>
                                <span class="badge" th:classappend="${room.status == 'AVAILABLE' ? 'bg-success' : (room.status == 'OCCUPIED' ? 'bg-danger' : 'bg-warning')}" th:text="${room.status}">AVAILABLE</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rooms)}">
                            <td colspan="6" class="text-center text-muted py-4">No rooms available. Add one!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="layout :: scripts"></div>
</body>
</html>
