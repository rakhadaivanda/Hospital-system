<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Book Appointment')"></head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-glass sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/patient/dashboard"><i class="fa-solid fa-staff-snake me-2"></i>CareHub Patient</a>
            <div class="ms-auto d-flex align-items-center">
                <a href="/patient/appointments" class="btn btn-sm btn-outline-primary me-3">Back to Appointments</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 animate-fade-in">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-card p-5">
                    <h3 class="fw-bold mb-4 text-center">Book an Appointment</h3>
                    <form action="/patient/appointments/book" method="post">
                        <div class="mb-3">
                            <label class="form-label">Select Doctor / Specialist</label>
                            <select class="form-select" name="doctorId" required>
                                <option value="Dr. Budi (Cardiologist)">Dr. Budi (Cardiologist)</option>
                                <option value="Dr. Siti (Pediatrician)">Dr. Siti (Pediatrician)</option>
                                <option value="Dr. Andi (General)">Dr. Andi (General)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Preferred Date</label>
                            <input type="date" class="form-control" name="appointmentDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Reason for Visit</label>
                            <textarea class="form-control" rows="3" name="notes" placeholder="Describe your symptoms..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 mt-3">Confirm Booking</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="layout :: scripts"></div>
</body>
</html>
