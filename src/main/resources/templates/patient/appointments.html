<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('My Appointments')"></head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-glass sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/patient/dashboard"><i class="fa-solid fa-staff-snake me-2"></i>CareHub Patient</a>
            <div class="ms-auto d-flex align-items-center">
                <a href="/patient/dashboard" class="btn btn-sm btn-outline-primary me-3">Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5 animate-fade-in">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">My Appointments</h2>
            <a href="/patient/appointments/book" class="btn btn-primary-custom"><i class="fa-solid fa-plus me-2"></i> Book New</a>
        </div>
        
        <div th:if="${#lists.isEmpty(appointments)}" class="glass-card p-4 text-center py-5">
            <i class="fa-solid fa-calendar-check fa-4x text-muted mb-3"></i>
            <h4 class="text-muted">No appointments found</h4>
            <p>You haven't scheduled any appointments with our doctors yet.</p>
        </div>

        <div th:if="${not #lists.isEmpty(appointments)}" class="glass-card p-4">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Doctor</th>
                        <th>Status</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="appt : ${appointments}">
                        <td th:text="${appt.appointmentDate}">Date</td>
                        <td th:text="${appt.doctorId}">Doctor</td>
                        <td>
                            <span class="badge bg-warning text-dark" th:if="${appt.status == 'REQUESTED'}">Requested</span>
                            <span class="badge bg-success" th:if="${appt.status == 'SCHEDULED'}">Scheduled</span>
                        </td>
                        <td th:text="${appt.notes}">Notes</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="layout :: scripts"></div>
</body>
</html>
