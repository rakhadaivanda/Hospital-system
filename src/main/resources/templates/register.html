<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Register')"></head>
<body class="d-flex align-items-center bg-light">

    <div class="container animate-fade-in py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-plus text-primary fa-3x mb-3"></i>
                        <h3 class="fw-bold">Create Account</h3>
                        <p class="text-muted">Join CareHub as a Patient</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger rounded-4" th:text="${error}"></div>

                    <form th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-medium">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary-custom btn-lg">Create Account</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Already have an account? <a href="/login" class="text-primary text-decoration-none fw-semibold">Sign In</a></p>
                        <a href="/" class="text-muted text-decoration-none small"><i class="fa-solid fa-arrow-left mt-3"></i> Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="layout :: scripts"></div>
</body>
</html>
