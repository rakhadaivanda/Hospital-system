<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Login')"></head>
<body class="d-flex align-items-center bg-light">

    <div class="container animate-fade-in">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-staff-snake text-primary fa-3x mb-3"></i>
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p class="text-muted">Sign in to your CareHub account</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger rounded-4">
                        Invalid username and password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success rounded-4">
                        You have been logged out.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success rounded-4">
                        Registration successful! Please log in.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-medium">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary-custom btn-lg">Sign In</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-semibold">Register here</a></p>
                        <a href="/" class="text-muted text-decoration-none small"><i class="fa-solid fa-arrow-left mt-3"></i> Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="layout :: scripts"></div>
</body>
</html>
