<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - CareHub Hospital'">Hospital System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Scripts -->
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>

    <!-- Admin Sidebar -->
    <div th:fragment="admin_sidebar(activePage)" class="sidebar d-flex flex-column">
        <h4 class="fw-bold text-primary mb-4"><i class="fa-solid fa-staff-snake me-2"></i>CareHub</h4>
        
        <div class="nav flex-column nav-pills">
            <a class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}" href="/admin/dashboard">
                <i class="fa-solid fa-chart-pie me-2"></i> Dashboard
            </a>
            <a class="nav-link" th:classappend="${activePage == 'patients' ? 'active' : ''}" href="/admin/patients">
                <i class="fa-solid fa-users me-2"></i> Patients
            </a>
            <a class="nav-link" th:classappend="${activePage == 'rooms' ? 'active' : ''}" href="/admin/rooms">
                <i class="fa-solid fa-bed me-2"></i> Rooms
            </a>
            <a class="nav-link" th:classappend="${activePage == 'pharmacy' ? 'active' : ''}" href="/admin/pharmacy">
                <i class="fa-solid fa-pills me-2"></i> Pharmacy
            </a>
            <a class="nav-link" th:classappend="${activePage == 'billing' ? 'active' : ''}" href="/admin/billing">
                <i class="fa-solid fa-file-invoice-dollar me-2"></i> Billing
            </a>
        </div>
        
        <div class="mt-auto">
            <hr>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-danger w-100 rounded-3">
                    <i class="fa-solid fa-right-from-bracket me-2"></i> Logout
                </button>
            </form>
        </div>
    </div>
</body>
</html>
